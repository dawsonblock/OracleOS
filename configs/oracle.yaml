# Oracle Runtime Configuration
# ─────────────────────────────────────────────────────
# This is the canonical config loaded by OracleRuntime at boot.

runtime:
  name: "Oracle-OS"
  version: "0.1.0"
  log_level: "info"           # debug | info | warn | error
  data_dir: "./data"
  log_dir: "./logs"

# Memory — GraphStore (R2: 3 categories)
memory:
  database: "./data/oracle.db"
  trace_retention_days: 90
  max_graph_nodes: 100000

# Policy — VerifiedActionExecutor gating
policy:
  system_actions_enabled: true
  tool_actions_enabled: true
  code_actions_enabled: true
  sandbox_threshold: "elevated"   # safe | low | elevated | high | critical
  require_approval_above: "high"

# Planning
planning:
  max_plan_actions: 25
  simulation_enabled: true
  confidence_threshold: 0.3

# Prompt engine
prompt:
  default_token_budget: 8192
  cache_enabled: true

# MCP server
mcp:
  enabled: true
  port: 9100
  host: "127.0.0.1"

# Sidecar endpoints
sidecars:
  sandbox:
    url: "http://127.0.0.1:8080"
    timeout: 60
  codeindex:
    url: "http://127.0.0.1:8081"
    timeout: 10
  contextdb:
    url: "http://127.0.0.1:8082"
    timeout: 10
  metasearch:
    url: "http://127.0.0.1:8084"
    timeout: 15
  crawler:
    url: "http://127.0.0.1:8083"
    timeout: 20

# Experiments (Phase 19)
experiments:
  max_parallel: 3
  worktree_base: "/tmp/oracle-experiments"
  timeout_seconds: 300

# Browser automation
browser:
  debugger_url: "http://127.0.0.1:9222"
  headless: false

# Host automation (macOS Accessibility)
host:
  accessibility_enabled: true
