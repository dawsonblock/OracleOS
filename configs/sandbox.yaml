# Sandbox Sidecar Configuration

sandbox:
  port: 8080
  host: "0.0.0.0"

  # Docker image for ephemeral containers
  default_image: "python:3.12-slim"

  # Resource limits per execution
  limits:
    timeout_seconds: 60
    max_memory_mb: 512
    max_cpu_shares: 256
    max_output_bytes: 4096

  # Network policy
  network:
    enabled: false      # containers run without network by default
    allow_dns: false
