version: "3.8"

services:
  metasearch:
    image: searxng/searxng:latest
    container_name: oracle-metasearch
    ports:
      - "8084:8888"
    environment:
      - SEARXNG_BASE_URL=http://localhost:8084
    volumes:
      - ./settings.yml:/etc/searxng/settings.yml:ro
    restart: unless-stopped
